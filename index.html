
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#09090b">

    <title>Okan Sakarya | Yapım Aşamasında</title>
    <meta name="description" content="Okan Sakarya kişisel yazılım geliştirme portfolyosu. Çok yakında yayında.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #09090b;
            color: #fafafa;
            font-family: Arial, sans-serif;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            text-align: center;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 65px;
        }

        .logo span {
            color: #8b5cf6;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 9px 16px;
            border: 1px solid #27272a;
            border-radius: 30px;
            color: #a1a1aa;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #8b5cf6;
            border-radius: 50%;
            box-shadow: 0 0 12px #8b5cf6;
        }

        h1 {
            font-size: clamp(38px, 7vw, 62px);
            line-height: 1.1;
            letter-spacing: -2px;
            margin-bottom: 22px;
        }

        h1 span {
            color: #8b5cf6;
        }

        .description {
            color: #a1a1aa;
            font-size: 16px;
            line-height: 1.8;
            max-width: 480px;
            margin: 0 auto 38px;
        }

        .domain {
            display: inline-block;
            color: #d4d4d8;
            text-decoration: none;
            border: 1px solid #27272a;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            transition: .2s;
        }

        .domain:hover {
            border-color: #8b5cf6;
            color: #a78bfa;
        }

        footer {
            margin-top: 85px;
            color: #52525b;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <main class="container">

        <div class="logo">OKAN<span>.</span></div>

        <div class="status">
            <span class="dot"></span>
            Web sitesi geliştiriliyor
        </div>

        <h1>
            Yeni bir şeyler<br>
            <span>inşa ediyoruz.</span>
        </h1>

        <p class="description">
            Kişisel portfolyom, projelerim ve yazılım geliştirme
            çalışmalarım çok yakında burada olacak.
            Biraz sabır, görüşmek üzere!
        </p>

        <a class="domain" href="https://okansakarya.dev">
            okansakarya.dev
        </a>

        <footer>
            © 2026 Okan Sakarya. Tüm hakları saklıdır.
        </footer>

    </main>
</body>
</html>
